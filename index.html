<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模擬問題自動作成プロンプト｜生成AIパスポート学習ツール</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", "Hiragino Sans", sans-serif; }
    body { padding: 20px; max-width: 900px; margin: 0 auto; background: #e6f2fc; }
    h2 { text-align: center; margin: 10px 0 30px; color: #1e3a5f; font-size: 24px; font-weight: 600; letter-spacing: 0.5px; }

    .usage-note {
      background: #fff;
      border-left: 4px solid #73b6e8;
      padding: 16px;
      margin-bottom: 30px;
      border-radius: 8px;
      color: #1e3a5f;
      line-height: 1.7;
      font-size: 15px;
    }

    .chapter-block {
      background: #fff;
      padding: 24px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 1px 4px rgba(30,58,95,0.04), 0 4px 12px rgba(30,58,95,0.06);
      transition: transform 0.2s;
    }
    .chapter-block:hover { transform: translateY(-2px); }
    .chapter-title {
      font-size: 19px;
      font-weight: 600;
      color: #1e3a5f;
      margin-bottom: 16px;
      padding-bottom: 6px;
      border-bottom: 2px solid #cce4f9;
    }
    .button-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .menu-btn {
      display: block;
      padding: 15px 12px;
      font-size: 15px;
      font-weight: 500;
      border: 2px solid #73b6e8;
      border-radius: 10px;
      background: #b8e0f9;
      color: #1e3a5f;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: all 0.25s;
      box-shadow: 0 2px 6px rgba(66,153,225,0.15);
    }
    .menu-btn:hover {
      background: #9dd3f7;
      border-color: #4fa8e0;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(66,153,225,0.25);
    }

    @media (max-width: 600px) {
      .button-row { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 400px) {
      .button-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ★★★ コツ ★★★ -->
   <button
    style="display:block; width:100%; margin-bottom:30px; padding:15px 12px; font-size:15px; font-weight:600; border:2px solid #e57373; border-radius:10px; background:#ffebee; color:#c62828; cursor:pointer; text-align:center; transition:all 0.25s; box-shadow:0 2px 6px rgba(229,115,115,0.25);"
    onmouseover="this.style.background='#ffcdd2';this.style.borderColor='#d32f2f';this.style.transform='translateY(-1px)';this.style.boxShadow='0 4px 12px rgba(229,115,115,0.4)';"
    onmouseout="this.style.background='#ffebee';this.style.borderColor='#e57373';this.style.transform='none';this.style.boxShadow='0 2px 6px rgba(229,115,115,0.25)';"
    onclick="alert(
      '【プロンプトが追従されない場合のコツ】\n' +
      '\n' +
      'プロンプト通りに実行されない場合は都度入力して指示を出してください\n' +
      '\n' +
 　  '(例)\n' +
      '・次の問題を出して\n' +
      '・問題は１問ずつ出題して\n' +
      '・解説がありません\n' +
　　'・プロンプトを遵守してください\n' +
      '\n' +
　　'※何度指摘しても変わらない不備がありましたらプロンプトを再度\n' +
　　'　修正対応しますので、ご連絡ください。\n' +
      '\n' +
　　'・各社AIアプリによるプロンプトの理解度について\n' +
　　'\n' +
　　'複数の理由がありAIアプリ（モデル）によって差（個性）があります。\n' +
　　'AIアプリによって得意/不得意があるということです。\n' +
　　'各プロンプトを見ていただいたら分かるように、条件分岐や構造が\n' +
　　'複雑な命令になっています。\n' +
　　'人間側がどれだけ理想的な指示を盛り込むかより、AIが確実にミスなく\n' +
　　'こなせる「シンプルさ」を基準に設計するほうが、望む結果になりがち\n' +
　　'です。理想的な複雑な指示とAIが理解できる指示のギリギリを狙って\n' +
　　'作成していますので、同じAIでも追従指示の精度に差が出る結果に\n' +
　　'なります。ご了承ください。'
    )"

  >AIがプロンプト通りに動いてくれないとき</button>
